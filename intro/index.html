<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SONGJUN DESIGN Intro</title>
  <link rel="preload" href="intro-background-optimized.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="preload" href="文字层.png" as="image" fetchpriority="high" media="(min-width:681px)">



  <link rel="icon" href="../favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="intro" role="button" tabindex="0" aria-label="Into SONGJUN DESIGN portfolio">
    <img class="bg" src="intro-background-optimized.webp" alt="" fetchpriority="high" decoding="async">

    <img class="cloud cloud-back cb-left" data-desktop-src="fog-cluster-08.png" alt="" aria-hidden="true" decoding="async">
    <img class="cloud cloud-back cb-right" data-desktop-src="fog-cluster-09.png" alt="" aria-hidden="true" decoding="async">

    <div class="mobile-intro-header" aria-hidden="true">
      <span class="mobile-menu-mark"></span>
      <span class="mobile-brand">SJ DESIGN PORTFOLIO</span>
      <span class="mobile-brand-year">SINCE 2011</span>
    </div>
    <div class="mobile-intro-copy" aria-hidden="true">
      <strong class="mobile-title">VISUAL DESIGN<br>ARCHIVE</strong>
      <span class="mobile-title-sub">SINCE 2011</span>
      <span class="mobile-into">Into</span>
    </div>

    <img class="text-layer text-fixed" data-desktop-src="文字层.png" alt="SONGJUN DESIGN Visual Design Archive Since 2011 Into" fetchpriority="high" decoding="async">
    <img class="cloud cloud-front cf-left" data-desktop-src="fog-cluster-01.png" alt="" aria-hidden="true" decoding="async">

    <img class="cloud cloud-low" data-desktop-src="fog-cluster-07.png" alt="" aria-hidden="true" decoding="async">
    <img class="cloud cloud-near cn-left" data-desktop-src="fog-cluster-04.png" alt="" aria-hidden="true" decoding="async">
    <img class="cloud cloud-near cn-right" data-desktop-src="fog-cluster-02.png" alt="" aria-hidden="true" decoding="async">
    <img class="cloud cloud-near cn-bottom" data-desktop-src="fog-cluster-06.png" alt="" aria-hidden="true" decoding="async">
    <img class="button-edge-glow" data-desktop-src="button-edge-glow.png" alt="" aria-hidden="true" decoding="async">

    <div class="wash" aria-hidden="true"></div>
